{% set version = "0.6.0" %}
{% set build = 0 %}
{% set name = "pymartini" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b823b6889bda5c287251a554a74caddd0e0838e7e00421fe81d0c35f7c090b06

build:
  number: 0
  skip: true  # [py<311]
  script:
    # The sdist ships a martini.c generated against numpy 2.5 headers, which
    # don't exist for Python 3.11. Regenerate it against the host numpy.
    - rm pymartini/martini.c  # [unix]
    - del pymartini\martini.c  # [win]
    - {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - numpy
    - cython
    - pip
    - setuptools >=77
  run:
    - python

test:
  imports:
    - pymartini

about:
  home: https://github.com/kylebarron/pymartini
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A Cython port of Martini for fast RTIN terrain mesh generation
  description: |
    A Cython port of Martini for fast RTIN terrain mesh generation, 2-3x faster than Martini in Node.
    The only dependency is Numpy.
  doc_url: https://github.com/kylebarron/pymartini
  dev_url: https://github.com/kylebarron/pymartini

extra:
  recipe-maintainers:
    - davidbrochart
    - kylebarron
